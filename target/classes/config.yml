# Cback 插件設定檔

prefix: "&8[&6Cback&8] "
teleport-delay-seconds: 5
cancel-teleport-on-move: true
cancel-teleport-on-damage: true
save-cooldown-ms: 1000
min-distance: 3.0
record-death: true

allowed-causes:
  - COMMAND
  - PLUGIN
  - NETHER_PORTAL
  - END_PORTAL
  - SPECTATE

messages:
  no-permission: "&c&l錯誤 &8- &7您沒有執行此指令的權限！"
  no-location: "&c&l提示 &8- &7找不到您的歷史位置紀錄！"
  teleporting: "&a&l傳送 &8- &7正在為您傳送回歷史位置，請稍候..."
  teleport-fail: "&c&l失敗 &8- &7傳送失敗，可能目標區域未載入或安全檢查未通過。"
  reload-success: "&a&l系統 &8- &7設定檔與歷史資料已重新載入完成！"
  only-players: "&c&l錯誤 &8- &7此指令只能由玩家在遊戲內執行！"

  teleporting-already: "&c&l提示 &8- &7您已在傳送倒數中，請稍候！"
  teleport-countdown: "&a&l傳送 &8- &7將在 &e%d &a秒後進行傳送，請勿移動或受到傷害..."
  teleport-cancelled: "&c&l取消 &8- &7您移動了或受到傷害，傳送已取消！"

  arrival-title: "&a&l傳送成功"
