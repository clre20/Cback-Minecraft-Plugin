name: Cback
description: 記錄玩家傳送前位置的 /back 插件，完美相容 Geyser 用戶與 Multiverse-Core，提供歷史 GUI/Bedrock UI。
version: '2.0.1'
main: clre20.cback.Cback
api-version: '1.21'
load: POSTWORLD
authors: [ Clre20 ]

commands:
  cback:
    description: Cback 主指令，用於返回上一次的位置或重新載入設定。
    permission: cback.use
  back:
    description: 快捷指令，用於傳送回上一次的位置。
    permission: cback.use
  eback:
    description: 開啟傳送歷史選單 (支援 Java 介面與 Bedrock 專用表單)。
    permission: cback.use

permissions:
  cback.use:
    description: 允許玩家傳送回上一次位置及開啟歷史選單的權限
    default: true
  cback.admin:
    description: 允許管理員重新載入插件設定與資料的權限
    default: op
